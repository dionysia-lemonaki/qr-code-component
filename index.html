<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Component</title>
  </head>
  <body>
    <main class="min-h-screen flex flex-col justify-center items-center p-4">
      <div
        class="bg-white max-w-xs p-4 pb-10 space-y-6 text-center rounded-[20px]"
      >
        <img
          src="/image-qr-code.png"
          alt="QR code to frontendmentor.io"
          width="288"
          height="288"
          class="rounded-[10px]"
        />
        <div class="px-4 space-y-4">
          <h1 class="font-bold text-[1.375rem] leading-[1.2] text-slate-900">
            Improve your front-end skills by building projects
          </h1>
          <p
            class="font-normal text-[0.9375rem] leading-[1.4] tracking-[0.0133em] text-slate-500"
          >
            Scan the QR code to visit Frontend Mentor and take your coding
            skills to the next level
          </p>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
